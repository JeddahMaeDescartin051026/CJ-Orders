<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>CJ Orders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login -->
  <main class="login" id="login-view">
    <form class="panel login-card" id="login-form">
      <div class="brand">❦ CJ Orders</div>
      <p class="muted">Sign in to view your orders.</p>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Sign in</button>
      <p class="error" id="login-error" role="alert" hidden></p>
    </form>
  </main>

  <!-- Dashboard -->
  <div id="app-view" hidden>
    <header class="site-header">
      <div class="brand">❦ CJ Orders</div>
      <nav class="tabs" id="tabs" aria-label="Filter orders"></nav>
      <button class="btn ghost" id="signout" type="button">Sign out</button>
    </header>
    <main class="orders" id="orders" aria-live="polite"></main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
